name: release

# Build the binaries whenever a version tag is pushed:
#   git tag v2 && git push --tags
# GitHub does the cross-compiling and attaches the files to a Release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross-compile
        run: |
          mkdir dist
          for t in windows/amd64/.exe darwin/arm64/ darwin/amd64/ linux/amd64/; do
            IFS=/ read -r os arch ext <<<"$t"
            echo "building $os/$arch"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 \
              go build -trimpath -ldflags='-s -w' -o "dist/pym-$os-$arch$ext" .
          done
          cp gamestate_integration_pym.cfg dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
